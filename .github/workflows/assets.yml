# Every file under assets/, lockups/, repos/, social/ and web/, plus tokens.json and the
# README palette table, is written by generate.py. This fails when one of them
# no longer matches the script, so a hand edit, or a script change committed
# without its output, cannot land.
name: Generated assets

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: generated files are current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Check generated files
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt python generate.py --check
