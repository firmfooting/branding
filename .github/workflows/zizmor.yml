# The org's workflow security audit; the check itself, and why it exists, live
# in firmfooting/.github's zizmor.yml so every repository runs the same one.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/zizmor.yml@abe24470fa14dea65f4cf6fca0f9e3cec6b0135a # v1.1.0
