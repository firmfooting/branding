# Git hooks, run by prek (https://prek.j178.dev/). The file keeps the
# `.pre-commit-config.yaml` name because that is the format prek reads.
# Install once with `uv run prek install`; run everything with
# `uv run prek run --all-files`. prek is pinned in the dev group.
# CI runs the same command through firmfooting/.github's prek.yml, so a hook
# can never disagree with CI.
#
# Line endings are governed by .gitattributes (eol=lf), so no hook rewrites
# files; every hook below only checks.
minimum_pre_commit_version: "3.0.0"

# No commit-msg hook: this repository squash-merges, so only the PR title
# reaches main, and pr-title.yml checks that.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500]
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # Markdown style. Scope and rules live in .markdownlint-cli2.yaml. This `rev:`
  # is the only place the version is held; CI lints through this hook too.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # The workflow audit, offline here; CI's zizmor.yml adds the online audits.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # The same check as assets.yml: every generated file matches generate.py.
  - repo: local
    hooks:
      - id: generated-assets
        name: generated files are current
        entry: uv run --locked --no-sync python generate.py --check
        language: system
        pass_filenames: false
        always_run: true

  # The lint and type hooks call this project's pinned tools through `uv run`,
  # so a hook cannot drift from the version the lock names.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyrefly
        name: pyrefly (strict)
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
